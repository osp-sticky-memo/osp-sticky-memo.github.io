<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>딩동메모 - 메모 목록</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="list.css">
</head>
<body>
  <header>
    <div class="head-row">
      <h1>메모 목록 <span id="count" class="count"></span></h1>
      <button id="btn-settings" class="gear" title="설정">
        <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button id="btn-new" class="new">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        새 메모
      </button>
    </div>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="q" type="search" placeholder="제목이나 내용으로 찾기" autocomplete="off" spellcheck="false">
      </label>
      <select id="sort" title="정렬">
        <option value="updated">최근 수정순</option>
        <option value="alarm">알림 가까운 순</option>
        <option value="created">만든 순</option>
        <option value="title">제목순</option>
      </select>
    </div>
  </header>

  <ul id="list" class="list" aria-label="메모"></ul>
  <p id="empty" class="empty" hidden></p>
  <p class="foot-hint" id="foot-hint">메모를 목록 밖으로 끌어다 놓으면 바탕화면에 작게 꺼내 둘 수 있어요.</p>
  <div class="confirm" id="confirm" hidden>
    <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
      <div class="confirm-icon">
        <svg viewBox="0 0 16 16"><path d="M3.5 4.5h9M6.5 4.5V3h3v1.5M5 4.5l.6 8.5h4.8l.6-8.5"/></svg>
      </div>
      <h2 id="confirm-title">메모를 삭제할까요?</h2>
      <p class="confirm-memo" id="confirm-memo"></p>
      <p class="confirm-desc" id="confirm-desc">삭제한 메모는 되돌릴 수 없어요.</p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="c-ghost">취소</button>
        <button id="confirm-ok" class="c-danger">삭제</button>
      </div>
    </div>
  </div>
  <footer class="app-foot">
    <span id="app-ver"></span>
    <a href="#" id="site-link">© 오상플레이 · ohsangplay.com</a>
  </footer>

  <script src="format.js"></script>
  <script src="list.js"></script>
</body>
</html>
