<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>딩동메모 - 메모 목록</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="list.css">
</head>
<body>
  <header>
    <div class="head-row">
      <h1>메모 목록 <span id="count" class="count"></span></h1>
      <button id="btn-settings" class="gear" title="설정">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M1.8 8h1.6M12.6 8h1.6M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></svg>
      </button>
      <button id="btn-new" class="new">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        새 메모
      </button>
    </div>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="q" type="search" placeholder="제목이나 내용으로 찾기" autocomplete="off" spellcheck="false">
      </label>
      <select id="sort" title="정렬">
        <option value="updated">최근 수정순</option>
        <option value="alarm">알림 가까운 순</option>
        <option value="created">만든 순</option>
        <option value="title">제목순</option>
      </select>
    </div>
  </header>

  <ul id="list" class="list" aria-label="메모"></ul>
  <p id="empty" class="empty" hidden></p>

  <script src="format.js"></script>
  <script src="list.js"></script>
</body>
</html>
