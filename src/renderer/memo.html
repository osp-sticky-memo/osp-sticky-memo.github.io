<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>딩동메모</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="memo.css">
</head>
<body data-color="yellow">
  <header class="bar">
    <button class="icon" id="btn-new" title="새 메모">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <button class="icon" id="btn-list" title="메모 목록">
      <svg viewBox="0 0 16 16"><path d="M5.5 4.5h7M5.5 8h7M5.5 11.5h7"/><circle cx="3" cy="4.5" r=".6" class="fill"/><circle cx="3" cy="8" r=".6" class="fill"/><circle cx="3" cy="11.5" r=".6" class="fill"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="icon" id="btn-alarm" title="알림 시간 설정">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="9" r="5"/><path d="M8 6.5V9l1.8 1.2M3 3.5 4.8 2M13 3.5 11.2 2"/></svg>
    </button>
    <button class="icon" id="btn-pin" title="항상 위에 고정">
      <svg viewBox="0 0 16 16"><path d="M10.5 2.5 13.5 5.5 11 8l-.5 3-5-5 3-.5zM6 10 2.5 13.5"/></svg>
    </button>
    <button class="icon" id="btn-color" title="색상">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.2"/><circle cx="8" cy="8" r="2" class="fill"/></svg>
    </button>
    <button class="icon" id="btn-delete" title="삭제">
      <svg viewBox="0 0 16 16"><path d="M3.5 4.5h9M6.5 4.5V3h3v1.5M5 4.5l.6 8.5h4.8l.6-8.5"/></svg>
    </button>
    <button class="icon" id="btn-close" title="닫기 (트레이에서 다시 열 수 있어요)">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>

  <input id="title" class="title" type="text" maxlength="100" spellcheck="false" placeholder="제목 없음" autocomplete="off">
  <!-- 찾기 (Ctrl+F) -->
  <div class="find" id="find" hidden role="search">
    <svg class="find-ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input id="find-q" type="text" placeholder="메모에서 찾기" spellcheck="false" autocomplete="off" aria-label="메모에서 찾기">
    <span class="find-count" id="find-count" aria-live="polite"></span>
    <button class="find-btn" id="find-prev" title="이전 (Shift+Enter)" aria-label="이전">
      <svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg>
    </button>
    <button class="find-btn" id="find-next" title="다음 (Enter)" aria-label="다음">
      <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <button class="find-btn" id="find-close" title="닫기 (Esc)" aria-label="찾기 닫기">
      <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </div>
  <main>
    <div class="hl" id="hl" aria-hidden="true"></div>
    <textarea id="editor" spellcheck="false" placeholder="메모를 입력하세요"></textarea>
    <button class="link-chip" id="link-chip" hidden title="브라우저로 열기">
      <svg viewBox="0 0 16 16"><path d="M9 3h4v4M13 3 7.5 8.5M11.5 9.5v3a.5.5 0 0 1-.5.5H3.5a.5.5 0 0 1-.5-.5V5a.5.5 0 0 1 .5-.5h3"/></svg>
      <span id="link-chip-text"></span>
    </button>
  </main>

  <footer id="alarm-chip" hidden>
    <button id="chip-btn" class="chip">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="9" r="5"/><path d="M8 6.5V9l1.8 1.2"/></svg>
      <span id="chip-text"></span>
    </button>
  </footer>

  <!-- 색상 선택 -->
  <div class="panel" id="color-panel" hidden>
    <div class="swatches">
      <button data-c="yellow" title="노랑"></button>
      <button data-c="green" title="초록"></button>
      <button data-c="pink" title="분홍"></button>
      <button data-c="purple" title="보라"></button>
      <button data-c="blue" title="파랑"></button>
      <button data-c="gray" title="회색"></button>
    </div>
  </div>

  <!-- 알림 설정 -->
  <div class="sheet" id="alarm-panel" hidden>
    <div class="sheet-title">알림 시간</div>
    <div class="row">
      <input type="date" id="alarm-date">
      <input type="time" id="alarm-time">
    </div>
    <div class="quick">
      <button data-q="10m">+10분</button>
      <button data-q="30m">+30분</button>
      <button data-q="1h">+1시간</button>
      <button data-q="tomorrow9">내일 9시</button>
    </div>
    <div class="seg" id="alarm-repeat">
      <button data-r="none" class="on">한 번</button>
      <button data-r="daily">매일</button>
      <button data-r="weekdays">평일</button>
    </div>
    <div class="err" id="alarm-err"></div>
    <div class="actions">
      <button id="alarm-clear" class="ghost">알림 해제</button>
      <div class="spacer"></div>
      <button id="alarm-cancel" class="ghost">취소</button>
      <button id="alarm-save" class="primary">저장</button>
    </div>
  </div>

  <!-- 삭제 확인 -->
  <div class="sheet" id="delete-panel" hidden>
    <div class="sheet-title">이 메모를 삭제할까요?</div>
    <p class="muted">삭제한 메모는 되돌릴 수 없어요.</p>
    <div class="actions">
      <div class="spacer"></div>
      <button id="delete-cancel" class="ghost">취소</button>
      <button id="delete-ok" class="danger">삭제</button>
    </div>
  </div>

  <script src="format.js"></script>
  <script src="memo.js"></script>
</body>
</html>
