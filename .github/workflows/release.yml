# v로 시작하는 태그(예: v0.1.0)를 push하면 Windows 설치 파일을 빌드해서 Releases에 올립니다.
# 다운로드 주소: https://github.com/osp-sticky-memo/osp-sticky-memo.github.io/releases/download/<태그>/DingDongMemo-Setup-<버전>.exe
# 설치된 앱은 최신 릴리스의 latest.yml을 보고 자동 업데이트한다 (src/updater.js).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (예: v0.1.0) - package.json 버전과 같아야 함"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 태그와 package.json 버전 확인
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::태그($TAG)와 package.json 버전(v$VERSION)이 달라요."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm ci

      - name: 설치 파일 빌드
        run: npm run dist

      - name: Releases에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="dist/DingDongMemo-Setup-$VERSION.exe"
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          SIZE=$(( $(stat -c%s "$FILE") / 1048576 ))
          cat > notes.md <<EOF
          딩동메모 $VERSION (Windows 10/11 64비트, 약 ${SIZE}MB)

          다운로드 안내: https://osp-sticky-memo.github.io/

          SHA-256: \`$SHA\`
          EOF
          # 자동 업데이트용: latest.yml(새 버전 정보)과 blockmap(차등 다운로드)도 같이 올림
          ASSETS=("$FILE" "dist/latest.yml" "$FILE.blockmap")
          for f in "${ASSETS[@]}"; do test -f "$f" || { echo "::error::$f 가 없어요"; exit 1; }; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "딩동메모 $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
